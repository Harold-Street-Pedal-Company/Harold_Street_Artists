<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harold Street Players</title>

<style>
:root{
--bg:#f5f5f2;
--panel:#ffffff;
--text:#121212;
--muted:#666;
--line:#d8d8d2;
--accent:#111;
--accent-inverse:#fff;
--shadow:0 6px 20px rgba(0,0,0,0.08);
--radius:18px;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:var(--bg);
color:var(--text);
}

img{
max-width:100%;
display:block;
}

.wrap{
width:100%;
padding:14px 10px 40px;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#ffffff 0%,#efefea 100%);
border:1px solid var(--line);
border-radius:18px;
box-shadow:var(--shadow);
margin-bottom:18px;
}

.hero-inner{
display:grid;
grid-template-columns:1.6fr 1fr;
gap:18px;
padding:18px;
align-items:start;
}

.eyebrow{
font-size:11px;
font-weight:700;
letter-spacing:1.2px;
text-transform:uppercase;
padding:6px 10px;
border:1px solid var(--line);
border-radius:999px;
background:#fff;
display:inline-block;
margin-bottom:10px;
}

h1{
margin:0 0 8px;
font-size:clamp(2rem,3vw,3rem);
text-transform:uppercase;
letter-spacing:-1px;
}

.hero p{
margin:0;
color:#333;
}

.hero-side{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#fff;
border:1px solid var(--line);
border-radius:14px;
padding:12px;
min-height:80px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.stat-num{
font-size:1.8rem;
font-weight:700;
}

.stat-label{
font-size:.9rem;
color:var(--muted);
}

/* SEARCH BAR */

.controls{
margin-bottom:16px;
}

.controls-inner{
display:grid;
grid-template-columns:1.5fr 1fr auto;
gap:10px;
background:#fff;
border:1px solid var(--line);
border-radius:14px;
padding:10px;
}

.search input,
.filter select{
width:100%;
border:1px solid var(--line);
border-radius:10px;
padding:12px;
font-size:14px;
}

.results-count{
font-size:14px;
color:var(--muted);
align-self:center;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

/* CARD */

.card{
background:#fff;
border:1px solid var(--line);
border-radius:var(--radius);
overflow:hidden;
box-shadow:var(--shadow);
transition:.2s;
display:flex;
flex-direction:column;
}

.card:hover{
transform:translateY(-3px);
}

.card-media{
aspect-ratio:1/1;
overflow:hidden;
border-bottom:1px solid var(--line);
background:#eeeeea;
position:relative;
}

.card-media img{
width:100%;
height:100%;
object-fit:cover;
}

/* SLIDESHOW */

.slide{
display:none;
width:100%;
height:100%;
object-fit:cover;
}

.slide.active{
display:block;
}

.slide-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
width:34px;
height:34px;
border:0;
border-radius:999px;
background:rgba(0,0,0,.6);
color:#fff;
font-size:24px;
line-height:1;
cursor:pointer;
z-index:2;
}

.slide-btn:hover{
background:rgba(0,0,0,.85);
}

.slide-btn.prev{
left:10px;
}

.slide-btn.next{
right:10px;
}

.card-media.image-error::before{
content:"Image not found";
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:.9rem;
color:var(--muted);
padding:16px;
text-align:center;
}

.card-body{
padding:16px;
display:flex;
flex-direction:column;
gap:8px;
}

.artist-name{
margin:0;
font-size:1.2rem;
text-transform:uppercase;
}

.artist-meta{
font-size:.9rem;
color:var(--muted);
}

.artist-category{
font-size:.85rem;
font-weight:700;
text-transform:uppercase;
letter-spacing:.5px;
}

.artist-blurb{
font-size:.95rem;
line-height:1.45;
}

.artist-blurb p{
margin:0 0 .75rem;
}

.artist-blurb p:last-child{
margin-bottom:0;
}

.tag-row{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.tag{
font-size:11px;
padding:6px 8px;
border:1px solid var(--line);
border-radius:999px;
background:#fafafa;
}

.btn{
background:#111;
color:#fff;
border:none;
border-radius:10px;
padding:8px 12px;
cursor:pointer;
margin-top:4px;
width:max-content;
}

.details{
display:none;
margin-top:10px;
padding-top:10px;
border-top:1px solid var(--line);
}

.card.open .details{
display:block;
}

.quote{
background:#f7f7f4;
padding:10px;
border-left:4px solid #111;
border-radius:6px;
font-style:italic;
margin-top:6px;
line-height:1.45;
}

.socials{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px;
}

.socials a{
font-size:12px;
padding:6px 8px;
border:1px solid var(--line);
border-radius:999px;
text-decoration:none;
color:#111;
}

.socials a:hover{
background:#111;
color:#fff;
}

/* MOBILE */

@media(max-width:900px){
.hero-inner{
grid-template-columns:1fr;
}

.controls-inner{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>
<div class="wrap">

<section class="hero">
<div class="hero-inner">

<div>
<div class="eyebrow">Harold Street Team</div>
<h1>Harold Street Players</h1>
<p>Artists and bands using Harold Street Pedals in studios, basements, rehearsal spaces, and live rigs.</p>
</div>

<div class="hero-side">
<div class="stat">
<div class="stat-num" id="artistCount">0</div>
<div class="stat-label">Artists</div>
</div>

<div class="stat">
<div class="stat-num" id="pedalCount">0</div>
<div class="stat-label">Pedals</div>
</div>

<div class="stat">
<div class="stat-num">Local</div>
<div class="stat-label">Hamilton built</div>
</div>

<div class="stat">
<div class="stat-num">Live</div>
<div class="stat-label">Real boards</div>
</div>
</div>

</div>
</section>

<section class="controls">
<div class="controls-inner">

<div class="search">
<input id="searchInput" placeholder="Search artist, band, city, genre or pedal">
</div>

<div class="filter">
<select id="pedalFilter">
<option value="all">All pedals</option>
</select>
</div>

<div class="results-count">
<span id="visibleCount">0</span> visible
</div>

</div>
</section>

<section class="grid" id="artistGrid"></section>

</div>

<script>
const artists = [
{
name: "Sugar Report",
band: "Sugar Report",
city: "Hamilton",
category: "Rock and Roll, Alternative Rock, Punk Rock",

/*
Upload your image files to the same GitHub repo folder as artists.html.

Use paths like this:
"sugarreport.png"
"sugarreport2.png"
"sugarreport3.png"

Do not use github.com/.../blob/main/image.png
*/

images: [
"sugarreport.png"
"sugarreport2.png",
"sugarreport3.png"
"sugarreport4.png"
],

blurb: [
"Formed in the heart of Hamilton, Ontario, Sugar Report quickly established themselves in the local scene by creating songs that offer a view of the world around them. Their music is an honest and unflinching exploration of the human experience: the struggles, the triumphs, and the mundane moments in between. The band transforms raw, personal vulnerability into relatable, sing-along anthems, ensuring that every melody and lyric resonates deeply with the audience. Sugar Report released their debut single, \"All In My Head,\" in June 2025 and are currently gearing up for the release of their debut EP in Spring 2026. With a focus on authentic performance and genuine connection, Sugar Report is ready to bring the next wave of powerful, heartfelt rock to the festival stage.",
"Sugar Report captures the raw emotion and intricate storytelling of everyday life. Their sound is a dynamic collision of driving, melodic pop-punk reminiscent of The Wonder Years and Red City Radio, infused with the lyrical depth and conversational intimacy of bands like Modern Baseball and The Front Bottoms. The band pivots effortlessly between explosive, anthemic rock and quieter, folk-tinged acoustic moments, drawing heavily on the narrative-driven style found in projects like Aaron West and the Roaring Twenties. Audiences should expect intricate, catchy melodies set against high-energy, guitar-driven urgency."
],

pedals: ["Sugar Rush", "1992", "Cosmotone", "Doug Ford Hates You"],

quote: "Working with HSP pedals was such an easy and organic way to help us find the tones we have been hearing in our heads, and bringing them to life on the stage. Trusty, reliable, and friendly service, working with HSP is like having a 5th member of the band.",

links: {
instagram: "https://www.instagram.com/sugarreport416?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==",
spotify: "https://open.spotify.com/track/6vaOhx6yELETinPlsMp7X7?utm_medium=share&utm_source=linktree",
facebook: "https://www.facebook.com/sugarreport416",
linktree: "https://linktr.ee/sugarreport416",
apple: "https://geo.music.apple.com/us/album/_/1819977001?app=music&at=1000lHKX&ct=linktree_http&i=1819977002&itscg=30200&itsct=lt_m&ls=1&mt=1"
}
}
];

const grid = document.getElementById("artistGrid");
const searchInput = document.getElementById("searchInput");
const pedalFilter = document.getElementById("pedalFilter");
const visibleCount = document.getElementById("visibleCount");
const artistCount = document.getElementById("artistCount");
const pedalCount = document.getElementById("pedalCount");

function escapeHtml(value){
return String(value)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}

function uniquePedals(data){
return [...new Set(data.flatMap(a => a.pedals))];
}

function buildFilter(){
const pedals = uniquePedals(artists);

pedalCount.textContent = pedals.length;
artistCount.textContent = artists.length;

pedals.forEach(p => {
const opt = document.createElement("option");
opt.value = p.toLowerCase();
opt.textContent = p;
pedalFilter.appendChild(opt);
});
}

function render(){
grid.innerHTML = artists.map((artist, i) => {
const images = Array.isArray(artist.images) && artist.images.length ? artist.images : [];
const blurbHtml = artist.blurb.map(paragraph => `<p>${escapeHtml(paragraph)}</p>`).join("");

const searchText = [
artist.name,
artist.band,
artist.city,
artist.category,
artist.blurb.join(" "),
artist.pedals.join(" ")
].join(" ").toLowerCase();

const slideshowHtml = images.map((img, index) => `
<img
src="${escapeHtml(img)}"
alt="${escapeHtml(artist.name)} photo ${index + 1}"
class="slide ${index === 0 ? "active" : ""}"
loading="lazy"
onerror="this.closest('.card-media').classList.add('image-error'); this.remove();">
`).join("");

const slideshowButtons = images.length > 1 ? `
<button class="slide-btn prev" type="button" data-prev="${i}" aria-label="Previous image">‹</button>
<button class="slide-btn next" type="button" data-next="${i}" aria-label="Next image">›</button>
` : "";

return `
<article class="card" data-search="${escapeHtml(searchText)}" data-pedals="${escapeHtml(artist.pedals.join("|").toLowerCase())}">

<div class="card-media slideshow" data-slide="${i}">
${slideshowHtml}
${slideshowButtons}
</div>

<div class="card-body">
<h2 class="artist-name">${escapeHtml(artist.name)}</h2>
<div class="artist-meta">${escapeHtml(artist.band)} · ${escapeHtml(artist.city)}</div>
<div class="artist-category">${escapeHtml(artist.category)}</div>

<div class="artist-blurb">
${blurbHtml}
</div>

<div class="tag-row">
${artist.pedals.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join("")}
</div>

<button class="btn" type="button" data-toggle="${i}" aria-expanded="false">More</button>

<div class="details" id="d${i}">
<div class="quote">“${escapeHtml(artist.quote)}”</div>

<div class="socials">
${Object.entries(artist.links).map(([k, v]) => `<a href="${escapeHtml(v)}" target="_blank" rel="noopener noreferrer">${escapeHtml(k)}</a>`).join("")}
</div>
</div>

</div>
</article>`;
}).join("");

updateCount();
}

function toggleCard(button){
const card = button.closest(".card");
const isOpen = card.classList.toggle("open");

button.textContent = isOpen ? "Less" : "More";
button.setAttribute("aria-expanded", String(isOpen));
}

function changeSlide(index, direction){
const slideshow = document.querySelector(`.slideshow[data-slide="${index}"]`);
if(!slideshow) return;

const slides = [...slideshow.querySelectorAll(".slide")];
if(slides.length <= 1) return;

const currentIndex = slides.findIndex(slide => slide.classList.contains("active"));
const safeCurrentIndex = currentIndex >= 0 ? currentIndex : 0;
const nextIndex = (safeCurrentIndex + direction + slides.length) % slides.length;

slides[safeCurrentIndex].classList.remove("active");
slides[nextIndex].classList.add("active");
}

function filter(){
const q = searchInput.value.trim().toLowerCase();
const pedal = pedalFilter.value;
let shown = 0;

document.querySelectorAll(".card").forEach(c => {
const search = c.dataset.search;
const pedals = c.dataset.pedals;

const okSearch = !q || search.includes(q);
const okPedal = pedal === "all" || pedals.includes(pedal);
const show = okSearch && okPedal;

c.style.display = show ? "" : "none";

if(show) shown++;
});

visibleCount.textContent = shown;
}

function updateCount(){
visibleCount.textContent = document.querySelectorAll(".card").length;
}

buildFilter();
render();

searchInput.addEventListener("input", filter);
pedalFilter.addEventListener("change", filter);

grid.addEventListener("click", event => {
const prev = event.target.closest("button[data-prev]");
const next = event.target.closest("button[data-next]");
const button = event.target.closest("button[data-toggle]");

if(prev){
changeSlide(prev.dataset.prev, -1);
return;
}

if(next){
changeSlide(next.dataset.next, 1);
return;
}

if(button){
toggleCard(button);
}
});
</script>
</body>
</html>
